server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the "api" service name at request time (not just once at nginx
    # startup) so this doesn't break if the api container restarts or comes
    # up slightly after nginx does.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:3000;

    # Basic gzip for the (fairly large) script.js
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    # Don't cache the HTML shell so deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache versioned/static assets a bit more aggressively
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Proxy the tiny state API through to the backend container so the
    # frontend can call it same-origin (no CORS setup needed).
    location /api/ {
        proxy_pass $api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small health check endpoint for uptime checks / Pangolin health probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
