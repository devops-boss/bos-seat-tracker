services:
  seat-tracker:
    build:
      context: .
    image: seat-tracker:latest
    container_name: seat-tracker
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - seat-tracker-net
 
  api:
    build:
      context: ./server
    image: seat-tracker-api:latest
    container_name: seat-tracker-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - seat-tracker-data:/app/data
    networks:
      - seat-tracker-net
 
networks:
  seat-tracker-net:
    driver: bridge
 
volumes:
  seat-tracker-data: